<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按钮配色方案选择</title>
<style>
  body { background: #F8F6F3; min-height: 100vh; font-family: "Plus Jakarta Sans", -apple-system, "PingFang SC", sans-serif; padding: 40px 24px; color: #1A1A2E; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .sub { color: #5C5C72; font-size: 14px; margin-bottom: 40px; }
  .option { background: #fff; border: 1px solid #ECEAE6; border-radius: 16px; padding: 32px; margin-bottom: 24px; }
  .option h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .option .desc { color: #5C5C72; font-size: 13px; margin-bottom: 20px; }
  .btn-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .btn { padding: 14px 32px; border-radius: 12px; color: white; font-weight: 600; font-size: 15px; border: none; cursor: pointer; }
  .btn-outline { padding: 14px 32px; border-radius: 12px; font-weight: 500; font-size: 15px; cursor: pointer; background: #fff; }
  .tag { display: inline-block; padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; margin-right: 8px; }
  .sample-text { font-size: 13px; margin-top: 12px; }
  .sample-text a { text-decoration: underline; cursor: pointer; }
  .input { padding: 12px 16px; border-radius: 12px; border: 1.5px solid #ECEAE6; font-size: 15px; width: 260px; margin-top: 12px; outline: none; }
</style>
</head>
<body>
  <h1>按钮配色方案</h1>
  <p class="sub">背景 #F8F6F3 · 看哪个搭配最舒服，告诉我 A / B / C</p>

  <!-- A -->
  <div class="option">
    <h2>A · 暖棕 / 巧克力</h2>
    <p class="desc">沉稳高级，像 Aesop / 无印良品</p>
    <div class="btn-row">
      <button class="btn" style="background: #8B6E5A; box-shadow: 0 2px 8px rgba(139,110,90,0.25);">我是鹅厂人</button>
      <button class="btn-outline" style="border: 1px solid #ECEAE6; color: #5C5C72;">暂时不是</button>
    </div>
    <div>
      <span class="tag" style="background: rgba(139,110,90,0.08); color: #8B6E5A;">破冰</span>
      <span class="tag" style="background: rgba(139,110,90,0.05); color: #A8897A;">灵魂触碰</span>
    </div>
    <p class="sample-text">还没有账号？<a style="color: #8B6E5A;">去注册</a></p>
    <input class="input" placeholder="输入昵称" style="border-color: #ECEAE6;" onfocus="this.style.borderColor='#8B6E5A'" onblur="this.style.borderColor='#ECEAE6'" />
  </div>

  <!-- B -->
  <div class="option">
    <h2>B · 暖橙 / 赤陶</h2>
    <p class="desc">温暖有活力，像 Airbnb / 小红书</p>
    <div class="btn-row">
      <button class="btn" style="background: #C4654A; box-shadow: 0 2px 8px rgba(196,101,74,0.25);">我是鹅厂人</button>
      <button class="btn-outline" style="border: 1px solid #ECEAE6; color: #5C5C72;">暂时不是</button>
    </div>
    <div>
      <span class="tag" style="background: rgba(196,101,74,0.08); color: #C4654A;">破冰</span>
      <span class="tag" style="background: rgba(196,101,74,0.05); color: #D4856E;">灵魂触碰</span>
    </div>
    <p class="sample-text">还没有账号？<a style="color: #C4654A;">去注册</a></p>
    <input class="input" placeholder="输入昵称" onfocus="this.style.borderColor='#C4654A'" onblur="this.style.borderColor='#ECEAE6'" />
  </div>

  <!-- C -->
  <div class="option">
    <h2>C · 深墨绿</h2>
    <p class="desc">清新沉静，像 Notion / Aesop</p>
    <div class="btn-row">
      <button class="btn" style="background: #3D6B5E; box-shadow: 0 2px 8px rgba(61,107,94,0.25);">我是鹅厂人</button>
      <button class="btn-outline" style="border: 1px solid #ECEAE6; color: #5C5C72;">暂时不是</button>
    </div>
    <div>
      <span class="tag" style="background: rgba(61,107,94,0.08); color: #3D6B5E;">破冰</span>
      <span class="tag" style="background: rgba(61,107,94,0.05); color: #5E8F80;">灵魂触碰</span>
    </div>
    <p class="sample-text">还没有账号？<a style="color: #3D6B5E;">去注册</a></p>
    <input class="input" placeholder="输入昵称" onfocus="this.style.borderColor='#3D6B5E'" onblur="this.style.borderColor='#ECEAE6'" />
  </div>

  <p style="color: #9B9BAF; font-size: 12px; text-align: center; margin-top: 24px;">告诉我选 A / B / C</p>
</body>
</html>
